spring:
  datasource:
    # 测试使用独立命名的内存库，与本地演示库隔离；MySQL 兼容模式
    url: jdbc:h2:mem:airspace_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=10000
    username: sa
    password: ""
    hikari:
      maximum-pool-size: 10
      minimum-idle: 1
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
