spring:
  datasource:
    # 独立命名内存库，MySQL 兼容模式；与本地运行库隔离，用例间以唯一业务键隔离数据。
    url: jdbc:h2:mem:railtest;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=10000
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
    # 并发用例需要同时持有多个连接（并发工作者 + 外部锁线程），池容量须大于最大并发度。
    hikari:
      maximum-pool-size: 16
  sql:
    init:
      mode: always
      # 单资源解析，测试 classpath 优先，命中本目录的 H2 方言 schema.sql，
      # 避免默认 classpath*:schema.sql 同时执行主资源中的脚本。
      schema-locations: classpath:schema.sql
