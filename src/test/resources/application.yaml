spring:
  datasource:
    # 测试使用独立命名内存库，与本地运行库隔离；随 JVM 退出销毁。
    url: jdbc:h2:mem:maintenance_meter_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=10000
    username: sa
    password:
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always
      encoding: UTF-8
