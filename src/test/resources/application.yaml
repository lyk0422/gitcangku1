spring:
  datasource:
    # 独立命名内存库，MySQL 兼容模式；与主资源共用同一份 schema.sql（MySQL 方言），
    # 测试即验证主 schema 在 H2 MODE=MySQL 下可自动建表。
    url: jdbc:h2:mem:railtest;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=10000
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  sql:
    init:
      mode: always
      # 单资源解析，命中主资源中的 schema.sql（MySQL 方言，兼容 H2 MODE=MySQL）。
      schema-locations: classpath:schema.sql
