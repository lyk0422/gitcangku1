spring:
  datasource:
    url: jdbc:h2:mem:consent-test;MODE=MySQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  sql:
    init:
      mode: always
      # 与本地运行入口共用同一份 H2 建表脚本，直接验证自动初始化
      schema-locations: classpath:schema-h2.sql
  jackson:
    time-zone: Asia/Shanghai

server:
  error:
    include-message: never
    include-stacktrace: never
