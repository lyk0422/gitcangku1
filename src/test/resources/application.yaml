# 测试专用配置：使用独立命名的 H2 内存库（MySQL 兼容模式），与本地运行的 local_demo 隔离。
# 仅保证同一 JVM 内状态；场景间使用唯一键，避免顺序依赖。
spring:
  datasource:
    url: jdbc:h2:mem:test_destruction;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=10000
    username: sa
    password:
    driver-class-name: org.h2.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 10000
      validation-timeout: 3000
