spring:
  datasource:
    url: jdbc:h2:mem:snowpack-test;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  sql:
    init:
      mode: always
      encoding: UTF-8
  jackson:
    time-zone: UTC

server:
  error:
    include-message: never
    include-stacktrace: never