# 标准 Gradle test 使用独立命名的 H2 内存库（MODE=MySQL），随测试 JVM 退出释放。
spring:
  datasource:
    url: "jdbc:h2:mem:tagtest;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE"
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  sql:
    init:
      mode: always
      encoding: UTF-8
  jackson:
    time-zone: UTC
