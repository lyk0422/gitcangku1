# 测试配置：使用独立命名的 H2 内存库（MySQL 兼容模式），不依赖任何外部数据库。
# LOCK_TIMEOUT 放宽到 30s：并发用例中真实多线程持行锁跨多条 SQL，避免把锁等待超时
# （非业务 500）误判为业务结局；串行化正确性仍由行锁与唯一约束保证。
spring:
  datasource:
    url: jdbc:h2:mem:blindexp_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=30000
    username: sa
    password:
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always
  jackson:
    time-zone: Asia/Shanghai

logging:
  level:
    root: warn
