spring:
  datasource:
    url: jdbc:h2:mem:ewaste_test;MODE=MySQL
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
  sql:
    init:
      mode: always
      encoding: UTF-8
  jackson:
    time-zone: UTC

server:
  error:
    include-message: always