spring:
  application:
    name: gitcangku1-test
  datasource:
    # 测试专用独立命名内存库（MODE=MySQL）；不带 DB_CLOSE_DELAY，
    # 连接池随测试上下文关闭后数据库即释放，不依赖任何外部数据库。
    url: jdbc:h2:mem:artifact_lock_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE
    username: sa
    password: ""
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 10000
      validation-timeout: 3000
  sql:
    init:
      mode: embedded
      encoding: UTF-8
  jackson:
    time-zone: Asia/Shanghai
  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  port: 0
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
