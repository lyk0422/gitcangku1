spring:
  datasource:
    url: jdbc:h2:mem:curtailment-it-${random.uuid};MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 10000
  sql:
    init:
      mode: always
      encoding: UTF-8