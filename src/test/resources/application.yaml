spring:
  datasource:
    url: jdbc:h2:mem:cheese_aging_test;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
    hikari:
      maximum-pool-size: 8
      minimum-idle: 1
  sql:
    init:
      mode: always
      data-locations: optional:classpath:data-test.sql