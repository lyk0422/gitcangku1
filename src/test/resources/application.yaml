spring:
  datasource:
    url: jdbc:h2:mem:consent-test;MODE=MySQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  sql:
    init:
      mode: always
  jackson:
    time-zone: Asia/Shanghai

server:
  error:
    include-message: never
    include-stacktrace: never

app:
  synthetic-seed:
    # 测试场景数据由各用例自行建立并清理，关闭启动期合成数据初始化
    enabled: false
