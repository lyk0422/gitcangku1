spring:
  application:
    name: gitcangku1-test
  datasource:
    url: jdbc:h2:mem:baggage_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
  jackson:
    time-zone: Asia/Shanghai

server:
  error:
    include-message: never
    include-stacktrace: never

baggage:
  # 测试用较小的批量装载总重上限，便于构造超限场景
  max-load-total-weight-kg: 60

management:
  endpoints:
    web:
      exposure:
        include: health
