spring:
  datasource:
    # 标准 test 任务使用独立命名的 H2 内存库（MySQL 兼容模式），不连接任何外部数据库。
    # 每个 Spring 测试上下文使用独立命名的内存库，避免上下文重建时重复初始化互相干扰；
    # JVM 退出后内存数据随之消失。
    url: jdbc:h2:mem:berth-test-${random.uuid};MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=10000
    username: sa
    password:
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  sql:
    init:
      mode: embedded
      encoding: UTF-8
