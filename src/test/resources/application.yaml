spring:
  datasource:
    # 测试使用独立命名的 H2 内存库（MODE=MySQL），不依赖任何外部数据库
    url: jdbc:h2:mem:obsdb_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;LOCK_TIMEOUT=30000
    username: sa
    password:
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: embedded
  jackson:
    time-zone: UTC
