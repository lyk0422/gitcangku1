# 测试环境：独立命名的 H2 内存库（MySQL 兼容模式），与本地运行库隔离。
# 每个用例前清空业务表，避免顺序依赖；上下文关闭后内存库随 JVM 释放。
spring:
  datasource:
    url: jdbc:h2:mem:maintenance_meter_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=10000
    username: sa
    password:
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always
      encoding: UTF-8
