spring:
  main:
    allow-bean-definition-overriding: true
  datasource:
    # 测试使用独立命名的 H2 内存库（MODE=MySQL）；上下文关闭连接池后库即释放，不跨 JVM 保留。
    url: jdbc:h2:mem:berth_alloc_test;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql
