# 测试专用配置：独立的 H2 命名内存库，与本地运行库隔离。
# 不使用 DB_CLOSE_DELAY=-1：连接池在测试上下文存活期间持有连接，
# 上下文关闭后连接池释放，内存库随之销毁。
spring:
  application:
    name: gitcangku1-test
  datasource:
    url: jdbc:h2:mem:observation_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;LOCK_TIMEOUT=20000
    username: sa
    password: ""
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 10000
      validation-timeout: 3000
  sql:
    init:
      mode: always
      encoding: UTF-8
  jackson:
    time-zone: Asia/Shanghai

server:
  port: 0

management:
  endpoints:
    web:
      exposure:
        include: health
