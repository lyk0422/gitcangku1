spring:
  datasource:
    # 独立命名内存库，MySQL 兼容模式；与本地运行库隔离，用例间以唯一业务键隔离数据。
    url: jdbc:h2:mem:railtest;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=60000
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
    hikari:
      # 并发回归用例需同时持有“发布锁屏障连接 + 多个竞争工作连接”，
      # 放宽连接池上限以保证所有竞争线程都真实排队在数据库发布锁上，而非卡在取连接。
      maximum-pool-size: 12
      minimum-idle: 1
      connection-timeout: 30000
  sql:
    init:
      mode: always
      # 单资源解析，测试 classpath 优先，命中本目录的 H2 方言 schema.sql，
      # 避免默认 classpath*:schema.sql 同时执行主资源中的脚本。
      schema-locations: classpath:schema.sql
