spring:
  datasource:
    # 测试使用独立命名内存库，MySQL 兼容模式；数据仅存在于同一测试 JVM 内。
    url: jdbc:h2:mem:restitution_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=15000
    username: sa
    password:
    driver-class-name: org.h2.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  sql:
    init:
      mode: always
  main:
    allow-bean-definition-overriding: true
