spring:
  application:
    name: gitcangku1-test
  datasource:
    url: jdbc:h2:mem:incident_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
  jackson:
    time-zone: UTC

server:
  port: 0

management:
  endpoints:
    web:
      exposure:
        include: health
