spring:
  application:
    name: gitcangku1
  datasource:
    url: jdbc:h2:mem:firmware_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    hikari:
      maximum-pool-size: 10
      minimum-idle: 1
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
  jackson:
    time-zone: Asia/Shanghai

server:
  port: 0

logging:
  level:
    root: warn
