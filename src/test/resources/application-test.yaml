spring:
  datasource:
    url: jdbc:h2:mem:translation_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE
    username: sa
    driver-class-name: org.h2.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 1
      connection-timeout: 10000
  sql:
    init:
      mode: always

server:
  error:
    include-message: never
    include-stacktrace: never
