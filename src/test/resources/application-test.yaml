spring:
  datasource:
    url: jdbc:h2:mem:playout;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;LOCK_TIMEOUT=10000
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  sql:
    init:
      mode: always
      encoding: UTF-8
      schema-locations: classpath:schema-h2.sql
      # 测试库不加载本地演示种子数据，各用例自建合成数据、按唯一前缀相互隔离
      data-locations: optional:classpath:data-test.sql
  jackson:
    time-zone: Asia/Shanghai

server:
  port: 0
