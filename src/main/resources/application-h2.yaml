# 本地运行 profile：嵌入式 H2（MySQL 兼容模式），命名内存库，仅保证同一 JVM 内状态
# 显式指定仅执行 H2 兼容建表脚本，避免回退执行到 MySQL 版 schema.sql（含行内 COMMENT 语法）
spring:
  datasource:
    url: jdbc:h2:mem:local_demo;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-h2.sql
