spring:
  application:
    name: gitcangku1
  config:
    import: "optional:configtree:/run/secrets/"
  datasource:
    # 默认使用嵌入式 H2（MySQL 兼容模式）内存库，本地启动无需外部数据库；
    # 历史 MySQL 部署可经 DB_URL/DB_DRIVER/SCHEMA_LOCATIONS 环境变量覆盖。
    url: ${DB_URL:jdbc:h2:mem:rail_plan;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 10000
      validation-timeout: 3000
  jackson:
    time-zone: Asia/Shanghai
  sql:
    init:
      mode: always
      # 默认执行 H2（MySQL 兼容）建表脚本；MySQL 部署由环境变量指向 schema.sql。
      schema-locations: ${SCHEMA_LOCATIONS:classpath:schema-h2.sql}
  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  port: 8080
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
