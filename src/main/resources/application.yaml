spring:
  application:
    name: gitcangku1
  config:
    import: "optional:configtree:/run/secrets/"
  datasource:
    # 默认使用嵌入式 H2 内存库（MySQL 兼容模式），无需外部数据库；
    # 需要切回 MySQL 时，通过 DB_URL/DB_DRIVER/DB_USER 环境变量覆盖，并将
    # spring.sql.init.schema-locations 覆盖为 classpath:schema.sql
    url: ${DB_URL:jdbc:h2:mem:consent_demo;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
  sql:
    init:
      mode: always
      schema-locations: ${SCHEMA_LOCATIONS:classpath:schema-h2.sql}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 10000
      validation-timeout: 3000
  jackson:
    time-zone: Asia/Shanghai
  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  port: 8080
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
