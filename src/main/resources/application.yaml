spring:
  application:
    name: gitcangku1
  config:
    import: "optional:configtree:/run/secrets/"
  datasource:
    # 本地入口默认使用 H2 内存库（MySQL 兼容模式），随 JVM 退出释放，不依赖外部数据库；
    # 需要接入 MySQL 时通过 DB_URL/DB_USER/DB_PASSWORD 环境变量覆盖。
    url: ${DB_URL:jdbc:h2:mem:consent;MODE=MySQL;DB_CLOSE_DELAY=-1}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
  sql:
    init:
      mode: always
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 10000
      validation-timeout: 3000
  jackson:
    time-zone: UTC
  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  port: 8080
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
