spring:
  application:
    name: gitcangku1
  config:
    import: "optional:configtree:/run/secrets/"
  datasource:
    url: ${DB_URL:jdbc:h2:mem:consent-joint;MODE=MySQL;DB_CLOSE_DELAY=-1}
    username: ${DB_USER:sa}
  sql:
    init:
      mode: always
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 10000
      validation-timeout: 3000
  jackson:
    time-zone: Asia/Shanghai
  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  port: 8080
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

app:
  synthetic-seed:
    # 本地入口启动时初始化本题合成数据（合成主体 A/B 的研究授权代次 1），仅同 JVM 内存库留存
    enabled: true
