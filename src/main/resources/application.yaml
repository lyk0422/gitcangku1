spring:
  application:
    name: gitcangku1
  config:
    import: "optional:configtree:/run/secrets/"
  datasource:
    # 本地入口默认 H2 内存库（MySQL 兼容模式），仅保证当前 JVM 生命周期内的状态；
    # 外部部署可通过 DB_URL/DB_USER/DB_PASSWORD 覆盖为 MySQL（配合 SQL_INIT_PLATFORM=mysql）
    url: ${DB_URL:jdbc:h2:mem:consent;MODE=MySQL;DB_CLOSE_DELAY=-1}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
  sql:
    init:
      mode: always
    # MySQL 部署设置环境变量 SPRING_SQL_INIT_PLATFORM=mysql 即执行 classpath:schema-mysql.sql；
    # 不设置（默认）时执行 schema.sql（H2）。测试由 test resources 提供同名 H2 脚本。
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 10000
      validation-timeout: 3000
  jackson:
    time-zone: UTC
  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  port: 8080
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
