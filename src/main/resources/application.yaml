spring:
  application:
    name: gitcangku1
  config:
    import: "optional:configtree:/run/secrets/"
  datasource:
    # 默认使用嵌入式 H2（MySQL 兼容模式），本地运行与测试无需外部数据库；
    # 如需连接 MySQL，可通过 DB_URL / DB_USER / DB_DRIVER 环境变量覆盖。
    url: ${DB_URL:jdbc:h2:mem:baggage;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1}
    username: ${DB_USER:sa}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 10000
      validation-timeout: 3000
  sql:
    init:
      mode: always
      encoding: UTF-8
  jackson:
    time-zone: Asia/Shanghai
  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  port: 8080
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
