spring:
  application:
    name: gitcangku1
  datasource:
    # 默认使用 H2 内存库（MySQL 兼容模式），随 JVM 退出释放；可用 DB_URL/DB_USER 覆盖
    url: ${DB_URL:jdbc:h2:mem:reagentdb;MODE=MySQL;DB_CLOSE_DELAY=-1}
    username: ${DB_USER:sa}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 10000
      validation-timeout: 3000
  sql:
    init:
      mode: always
      encoding: UTF-8
  jackson:
    time-zone: Asia/Shanghai
  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  port: 8080
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never