spring:
  application:
    name: gitcangku1
  config:
    import: "optional:configtree:/run/secrets/"
  # 本地默认使用嵌入式 H2（MySQL 兼容模式），仅保证同一 JVM 内状态；
  # 需要外部 MySQL 时启用 mysql profile：--spring.profiles.active=mysql
  datasource:
    url: jdbc:h2:mem:consent_local;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-h2.sql
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 10000
      validation-timeout: 3000
  jackson:
    time-zone: Asia/Shanghai
  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  port: 8080
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
