spring:
  application:
    name: gitcangku1
  config:
    import: "optional:configtree:/run/secrets/"
  datasource:
    # 本地默认运行使用嵌入式 H2（MySQL 兼容模式），仅保证同一 JVM 内状态；
    # 可用环境变量覆盖为 MySQL：--spring.sql.init.platform=mysql 并提供 DB_URL/DB_USER/DB_PASSWORD。
    url: ${DB_URL:jdbc:h2:mem:consent_local;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
  sql:
    init:
      mode: always
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 10000
      validation-timeout: 3000
  jackson:
    time-zone: UTC
  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  port: 8080
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
