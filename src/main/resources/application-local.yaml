# 本地运行 profile：使用嵌入式 H2 内存库（MySQL 兼容模式），无需外部数据库或 Docker。
# 启动：./gradlew bootRun --args='--spring.profiles.active=local'
# 数据仅在同一 JVM 生命周期内有效，进程退出后丢失（DB_CLOSE_DELAY=-1 不提供跨进程持久化）。
spring:
  datasource:
    url: jdbc:h2:mem:local_calibration;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
  sql:
    init:
      mode: always
