# 本地运行 profile：嵌入式 H2（MODE=MySQL），自动建表，无需外部数据库或 Docker。
# 启动：./gradlew bootRun --args='--spring.profiles.active=local'
# 仅保证同一 JVM 内状态；进程退出后内存数据丢失，不提供跨进程持久化。
spring:
  datasource:
    url: jdbc:h2:mem:local_demo;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  sql:
    init:
      mode: always
      encoding: UTF-8
