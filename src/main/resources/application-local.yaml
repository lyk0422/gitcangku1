# 本地默认运行 profile：嵌入式 H2（MySQL 兼容模式）命名内存库，无需外部 MySQL 或 Docker。
# 数据仅存在于同一 JVM 内，进程退出即丢失，不提供跨进程/重启持久化（本题替代前题重启恢复要求）。
spring:
  datasource:
    url: jdbc:h2:mem:local_playout;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=10000
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  sql:
    init:
      mode: always
      encoding: UTF-8
      schema-locations: classpath:schema-h2.sql
