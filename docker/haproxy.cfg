global
    log stdout format raw local0
    maxconn 256

defaults
    mode tcp
    log global
    timeout connect 5s
    timeout client 60s
    timeout server 60s

resolvers docker
    nameserver dns 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 5s

frontend application
    bind :8080
    default_backend application

backend application
    server app app:8080 check resolvers docker init-addr libc,none
